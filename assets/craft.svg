<svg width="1200" height="310" viewBox="0 0 1200 310" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1200" y2="310" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0F14"/>
      <stop offset="1" stop-color="#111820"/>
    </linearGradient>
    <linearGradient id="a" x1="70" y1="0" x2="1130" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D6FF7F"/>
      <stop offset="0.5" stop-color="#7DE2D1"/>
      <stop offset="1" stop-color="#F4F1DE"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="310" rx="30" fill="url(#card)"/>
  <rect x="28" y="28" width="1144" height="254" rx="26" stroke="url(#a)" stroke-opacity="0.55" stroke-width="2"/>

  <text x="70" y="84" fill="#F4F1DE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="900">The Craft</text>
  <text x="70" y="116" fill="#AAB4A3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">What I try to bring into every project.</text>

  <g transform="translate(70 154)">
    <rect width="242" height="104" rx="22" fill="#10161D" stroke="#F4F1DE" stroke-opacity="0.12"/>
    <text x="24" y="42" fill="#D6FF7F" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="900">Interface</text>
    <text x="24" y="72" fill="#F4F1DE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Clean layouts that feel easy.</text>
  </g>
  <g transform="translate(342 154)">
    <rect width="242" height="104" rx="22" fill="#10161D" stroke="#F4F1DE" stroke-opacity="0.12"/>
    <text x="24" y="42" fill="#7DE2D1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="900">Logic</text>
    <text x="24" y="72" fill="#F4F1DE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Readable code that behaves well.</text>
  </g>
  <g transform="translate(614 154)">
    <rect width="242" height="104" rx="22" fill="#10161D" stroke="#F4F1DE" stroke-opacity="0.12"/>
    <text x="24" y="42" fill="#D6FF7F" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="900">Speed</text>
    <text x="24" y="72" fill="#F4F1DE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Small improvements every day.</text>
  </g>
  <g transform="translate(886 154)">
    <rect width="242" height="104" rx="22" fill="#10161D" stroke="#F4F1DE" stroke-opacity="0.12"/>
    <text x="24" y="42" fill="#7DE2D1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="900">Finish</text>
    <text x="24" y="72" fill="#F4F1DE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Details that make it feel done.</text>
  </g>

  <circle cx="1118" cy="72" r="6" fill="#D6FF7F">
    <animate attributeName="opacity" values="0.25;1;0.25" dur="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>
