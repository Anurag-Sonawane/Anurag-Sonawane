<svg width="1200" height="330" viewBox="0 0 1200 330" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05070B"/>
      <stop offset="0.55" stop-color="#07110C"/>
      <stop offset="1" stop-color="#05070B"/>
    </linearGradient>
    <linearGradient id="accent" x1="190" y1="0" x2="1010" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#39FF88"/>
      <stop offset="0.5" stop-color="#00D9FF"/>
      <stop offset="1" stop-color="#E8F0EA"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" stroke="#39FF88" stroke-opacity="0.035"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="330" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="30" fill="url(#grid)"/>
  <rect x="42" y="40" width="1116" height="250" rx="26" fill="#05070B" fill-opacity="0.72" stroke="#39FF88" stroke-opacity="0.18"/>

  <path d="M214 92H986" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
  <path d="M214 238H986" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" opacity="0.65"/>

  <circle cx="214" cy="92" r="5" fill="#39FF88" filter="url(#glow)">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="986" cy="238" r="5" fill="#00D9FF" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <text x="600" y="128" text-anchor="middle" fill="#39FF88" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="900" letter-spacing="7">DEVELOPER PROFILE</text>
  <text x="600" y="190" text-anchor="middle" fill="#E8F0EA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="64" font-weight="900">Anurag Sonawane</text>
  <text x="600" y="224" text-anchor="middle" fill="#99A8A1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">Clean UI. Useful projects. Consistent progress.</text>
</svg>
